<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 가족 여행</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: #e2e8f0;
    }

    .header {
      text-align: center;
      margin-bottom: 52px;
    }
    .header .year {
      font-size: .85rem; font-weight: 600; letter-spacing: 3px;
      color: #93c5fd; text-transform: uppercase; margin-bottom: 10px;
    }
    .header h1 {
      font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px;
      line-height: 1.25;
    }
    .header p {
      margin-top: 10px; font-size: .95rem; color: #94a3b8;
    }

    .cards {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 780px;
      width: 100%;
    }

    .card {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 36px 32px 30px;
      width: 340px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform .2s, background .2s, box-shadow .2s;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      opacity: 0;
      transition: opacity .2s;
    }
    .card.france::before { background: linear-gradient(135deg, rgba(37,99,235,.18), rgba(124,58,237,.18)); }
    .card.italy::before  { background: linear-gradient(135deg, rgba(220,38,38,.18), rgba(234,179,8,.18)); }
    .card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,.35); }
    .card:hover::before { opacity: 1; }

    .card-flag { font-size: 3rem; line-height: 1; }

    .card-label {
      font-size: .72rem; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: #64748b;
    }
    .card-title {
      font-size: 1.35rem; font-weight: 800; line-height: 1.3;
    }
    .card-sub {
      font-size: .85rem; color: #94a3b8; line-height: 1.6;
    }

    .card-meta {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px;
    }
    .meta-badge {
      font-size: .72rem; font-weight: 600; padding: 3px 10px;
      border-radius: 999px; background: rgba(255,255,255,.1);
      color: #cbd5e1;
    }
    .france .meta-badge { background: rgba(37,99,235,.25); color: #93c5fd; }
    .italy  .meta-badge { background: rgba(220,38,38,.25);  color: #fca5a5; }

    .card-arrow {
      margin-top: auto;
      font-size: .88rem; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
      color: #64748b;
      transition: color .2s, gap .2s;
    }
    .card:hover .card-arrow { color: #e2e8f0; gap: 10px; }

    footer {
      margin-top: 52px;
      font-size: .75rem; color: #475569;
      text-align: center;
    }

    @media (max-width: 480px) {
      .header h1 { font-size: 1.7rem; }
      .card { width: 100%; padding: 28px 24px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="year">2026 Family Trip</div>
    <h1>가족 여행 일정</h1>
    <p>엄마의 환갑 기념 · 가족 6명</p>
  </div>

  <div class="cards">

    <!-- 프랑스 -->
    <a class="card france" href="2026_France_Trip_Itinerary.html">
      <div class="card-flag">🇫🇷</div>
      <div>
        <div class="card-label">August – September</div>
        <div class="card-title">프로방스–코트다쥐르</div>
      </div>
      <div class="card-sub">
        프로방스 협곡 → 뤼베롱 언덕마을 → 지중해<br>
        아비뇽 · 고흐드 · 베르동협곡 · 니스 · 모나코
      </div>
      <div class="card-meta">
        <span class="meta-badge">8월 28일 ~ 9월 5일</span>
        <span class="meta-badge">9일</span>
        <span class="meta-badge">6명</span>
      </div>
      <div class="card-arrow">일정 보기 →</div>
    </a>

    <!-- 이탈리아 -->
    <a class="card italy" href="2026_Italy_Trip_Itinerary.html">
      <div class="card-flag">🇮🇹</div>
      <div>
        <div class="card-label">September</div>
        <div class="card-title">북이탈리아</div>
      </div>
      <div class="card-sub">
        밀라노 → 꼬모 호수 → 돌로미티 → 베로나<br>
        오르티세이 · 트레치메 · 아레나 오페라
      </div>
      <div class="card-meta">
        <span class="meta-badge">9월 5일 ~ 9월 12일</span>
        <span class="meta-badge">8일</span>
        <span class="meta-badge">3명</span>
      </div>
      <div class="card-arrow">일정 보기 →</div>
    </a>

  </div>

  <footer>
    2026 가족 여행 &nbsp;·&nbsp; jinirong
  </footer>

</body>
</html>
